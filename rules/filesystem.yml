schema_version: 1
pack_id: hygiene.filesystem.core
version: 1.0.0
axis: filesystem
rules:
  - id: FS-TEMP-001
    title: Fichero de log abandonado
    why: Un log es un artefacto generado. Fuera de una carpeta ignorada suele ser residuo.
    severity: low
    risk: safe
    confidence: 0.9
    match:
      all:
        - glob: "**/*.log"
        - is_file: true
        - older_than: 30d
    evidence: [size, mtime]
    suggests:
      - type: quarantine
      - type: review

  - id: FS-TEMP-002
    title: Archivo comprimido abandonado
    why: Un zip o un tar sin referencia suele ser una descarga olvidada, no una dependencia.
    severity: low
    risk: medium
    confidence: 0.6
    match:
      all:
        - any:
            - glob: "**/*.zip"
            - glob: "**/*.tar.gz"
            - glob: "**/*.rar"
        - is_file: true
        - older_than: 90d
    evidence: [size, mtime]
    suggests:
      - type: review

  - id: FS-NAMING-001
    title: Fichero versionado a mano por el nombre
    why: >
      Un sufijo como final, v2, copy, backup u old indica una copia manual que
      sustituye al control de versiones. No implica que el fichero sea prescindible.
    severity: medium
    risk: medium
    confidence: 0.7
    match:
      all:
        - basename_regex: '(?i)[-_ ](final|copy|backup|old|prueba|temp)[0-9]*(\.[^.]+)?$'
        - is_file: true
    evidence: [size, mtime]
    suggests:
      - type: review

  - id: FS-DUP-001
    title: Fichero duplicado por contenido
    why: Dos ficheros con el mismo hash duplican mantenimiento y confunden al lector.
    severity: low
    risk: medium
    confidence: 0.8
    match:
      all:
        - is_file: true
        - sha256_duplicate: true
    evidence: [size]
    suggests:
      - type: review

  - id: FS-DEPTH-001
    title: Anidamiento excesivo
    why: Mas de ocho niveles suele indicar estructura accidental, no diseno.
    severity: info
    risk: safe
    confidence: 0.5
    match:
      all:
        - depth_gt: 8
        - is_file: true
    suggests:
      - type: review

  - id: FS-SYMLINK-001
    title: Enlace simbolico
    why: Un enlace puede apuntar fuera del proyecto y romper la reproducibilidad.
    severity: low
    risk: unknown
    confidence: 0.6
    match:
      is_symlink: true
    suggests:
      - type: review

  - id: FS-ROOT-001
    title: Fichero suelto en la raiz del workspace
    why: >
      En un workspace con proyectos, un fichero de la raiz que no pertenece a
      ninguno suele ser un resto de sesion. Un README, una licencia o la
      configuracion del propio workspace son legitimos.
    severity: low
    risk: medium
    confidence: 0.6
    match:
      all:
        - root_is_workspace: true
        - is_file: true
        - in_project: false
        - none:
            - depth_gt: 1
            - basename_regex: '(?i)^(readme|license|licence|changelog|contributing|security)(\.[a-z]+)?$'
            - basename_regex: '^\.(gitignore|gitattributes|editorconfig|hygienerc\.yml)$'
            - basename_regex: '^(CLAUDE|AGENTS|GEMINI)\.md$'
    suggests:
      - type: review

  - id: FS-BOUNDARY-001
    title: Frontera de proyecto con confianza insuficiente
    why: >
      El directorio tiene senales de proyecto, pero no suficientes. No se
      propone ninguna operacion sobre su contenido y su presencia impide
      declarar el workspace limpio hasta que una persona lo aclare.
    severity: info
    risk: unknown
    confidence: 1
    scope: project
    match:
      project_status: unknown-boundary
    suggests:
      - type: review

  - id: FS-GENERATED-001
    title: Directorio generado sin ignorar
    why: >
      Un node_modules, dist o .venv es reproducible y no debe versionarse.
      Nunca se pone en cuarentena: solo se comprueba que este ignorado.
    severity: medium
    risk: safe
    confidence: 0.9
    match:
      all:
        - is_dir: true
        - basename_regex: '^(node_modules|dist|build|target|coverage|\.venv|venv|__pycache__|\.next)$'
        - in_git_repo: true
        - ignored_by_git: false
    suggests:
      - type: ignore
      - type: review

  - id: FS-EMPTY-001
    title: Directorio vacio
    why: Un directorio vacio no aporta nada y Git ni siquiera lo conserva.
    severity: info
    risk: safe
    confidence: 0.7
    match:
      all:
        - is_dir: true
        - is_symlink: false
        - is_empty: true
    suggests:
      - type: review
