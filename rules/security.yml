schema_version: 1
pack_id: hygiene.security.core
version: 1.0.0
axis: security
rules:
  - id: SEC-SECRET-001
    title: Fichero de entorno versionado
    why: Un fichero de entorno versionado expone credenciales a todo el que clone.
    severity: critical
    risk: high
    confidence: 0.95
    match:
      all:
        - any:
            - glob: "**/.env"
            - glob: "**/.env.*"
        - none:
            - glob: "**/.env.example"
            - glob: "**/.env.sample"
        - tracked_by_git: true
    suggests:
      - type: ignore
      - type: review

  - id: SEC-KEY-001
    title: Clave privada en el arbol
    why: Una clave privada nunca debe vivir en un repositorio, ni versionada ni suelta.
    severity: critical
    risk: high
    confidence: 0.9
    match:
      any:
        - basename_regex: '^id_(rsa|dsa|ecdsa|ed25519)$'
        - content_matches: '-----BEGIN [A-Z ]*PRIVATE KEY-----'
    suggests:
      - type: review

  - id: SEC-CERT-001
    title: Certificado con clave publica
    why: >
      Un certificado publico puede ser legitimo y necesario. Se reporta para que
      una persona lo confirme, no como incidencia.
    severity: info
    risk: low
    confidence: 0.5
    match:
      all:
        - any:
            - glob: "**/*.crt"
            - glob: "**/*.cer"
        - is_file: true
    suggests:
      - type: review

  - id: SEC-ENTROPY-001
    title: Posible secreto por alta entropia
    why: >
      Una cadena de alta entropia puede ser un hash, un UUID o un token legitimo.
      Se reporta como posible secreto, nunca como confirmado.
    severity: medium
    risk: unknown
    confidence: 0.4
    match:
      all:
        - tracked_by_git: true
        - is_file: true
        - entropy_gt: 4.5
        - none:
            - glob: "**/*.lock"
            - glob: "**/package-lock.json"
            - glob: "**/*.min.js"
            - glob: "**/*.map"
            - all:
                - glob: "**/*.yml"
                - content_matches: 'pack_id:\s*hygiene\.'
    suggests:
      - type: review

  - id: SEC-DB-001
    title: Volcado de base de datos versionado
    why: >
      Un volcado versionado fuera de fixtures o migraciones suele contener datos
      reales. Un volcado no es malo por existir: se pondera ubicacion, version
      y referencias.
    severity: high
    risk: high
    confidence: 0.6
    match:
      all:
        - is_file: true
        - any:
            - glob: "**/*.sql"
            - glob: "**/*.dump"
            - glob: "**/*.sqlite"
            - glob: "**/*.sqlite3"
            - glob: "**/*.db"
        - tracked_by_git: true
        - referenced_by_source: false
        - none:
            - glob: "**/test/**"
            - glob: "**/tests/**"
            - glob: "**/fixtures/**"
            - glob: "**/__fixtures__/**"
            - glob: "**/spec/**"
            - glob: "**/migrations/**"
    suggests:
      - type: review

  - id: SEC-PERM-001
    title: Clave privada con permisos abiertos
    why: >
      Una clave privada legible por grupo u otros puede leerla cualquier
      proceso de la maquina. En Windows se reporta como no soportado.
    severity: high
    risk: low
    confidence: 0.8
    match:
      all:
        - is_file: true
        - any:
            - basename_regex: '^id_(rsa|dsa|ecdsa|ed25519)$'
            - glob: "**/*.pem"
            - glob: "**/*.key"
        - mode_too_open: true
    suggests:
      - type: review

  - id: SEC-HIST-001
    title: Secreto en el historico de Git
    why: >
      Un secreto que estuvo versionado sigue en el historico aunque se borre
      del arbol. La herramienta nunca reescribe historia: hay que rotar el
      secreto.
    severity: critical
    risk: high
    confidence: 0.7
    scope: project
    match:
      all:
        - is_git_repo: true
        - in_git_history:
            paths: ["**/.env", "**/.env.*", "**/id_rsa", "**/id_dsa", "**/id_ecdsa", "**/id_ed25519", "**/*.pem", "**/*.key"]
            except: ["**/.env.example", "**/.env.sample"]
    suggests:
      - type: review
